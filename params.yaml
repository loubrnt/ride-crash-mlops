# Parameters tracked by DVC (dvc.yaml) and logged to MLflow.
data:
  raw_path: data/raw/SRV3490.parquet           # not in git (268 MB), see README
  features_path: data/processed/features.csv   # one row per ride, committed (small)
  train_path: data/processed/train.csv
  test_path: data/processed/test.csv
  test_share: 0.2      # split by crash group: a crash ride and its 4 baselines stay together
  random_state: 42
  n_samples: 4         # example rides exported to samples/ for the web app

train:
  model: random_forest   # or logistic_regression
  n_estimators: 300
  max_depth: 8
  cv_folds: 5
  random_state: 42
  threshold: 0.5         # crash_detected = probability >= threshold

gate:
  min_auc: 0.70          # ROC AUC on the test set; a random model scores 0.50
